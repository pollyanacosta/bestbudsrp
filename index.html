<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Best Buds</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:
    linear-gradient(rgba(0,0,0,0.90), rgba(0,0,0,0.95)),
    url('https://images.unsplash.com/photo-1519750157634-b6d493a0f77c?q=80&w=1920&auto=format&fit=crop');

  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  min-height:100vh;
  color:white;
  padding:40px;
}

.container{
  max-width:1400px;
  margin:auto;
}

/* TOPO */

.topo{
  text-align:center;
  margin-bottom:40px;
}

.logo{
  width:180px;
  margin-bottom:20px;
  filter:drop-shadow(0 0 20px white);
}

.titulo{
  font-size:42px;
  color:#ffffff;
  font-weight:bold;
  letter-spacing:4px;
  text-transform:uppercase;
  text-shadow:0 0 15px rgba(255,255,255,0.5);
}

.sub{
  margin-top:10px;
  color:#aaa;
  letter-spacing:2px;
}

/* DADOS DA VENDA (funcionário / cliente) */

.dados-box{
  margin-bottom:35px;
  background:rgba(20,20,20,0.95);
  border:1px solid rgba(255,255,255,0.20);
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.dados-box h2{
  color:#ffffff;
  margin-bottom:20px;
  font-size:22px;
}

.dados-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
  gap:20px;
}

.campo-label{
  display:block;
  margin-bottom:8px;
  color:#aaa;
  font-size:14px;
  letter-spacing:1px;
  text-transform:uppercase;
}

/* ABAS */

.abas{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-bottom:35px;
}

.aba-btn{
  background:#1a1a1a;
  color:white;
  border:1px solid rgba(255,255,255,0.3);
  padding:15px 35px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  transition:0.3s;
}

.aba-btn:hover{
  background:#2a2a2a;
}

.aba-btn.ativa{
  background:#ffffff;
  color:black;
  box-shadow:0 0 15px rgba(255,255,255,0.4);
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
  gap:25px;
}

.card{
  background:rgba(20,20,20,0.95);
  border:1px solid rgba(255,255,255,0.20);
  border-radius:20px;
  overflow:hidden;
  transition:0.3s;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 25px rgba(255,255,255,0.25);
}

.card img{
  width:100%;
  height:220px;
  object-fit:contain;
  background:#0d0d0e;
  padding:20px;
}

.conteudo{
  padding:20px;
}

.nome{
  font-size:24px;
  margin-bottom:15px;
  color:#ffffff;
  font-weight:bold;
}

.info{
  margin-bottom:10px;
  color:#ccc;
}

.info span{
  color:white;
  font-weight:bold;
}

input{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2b2b2b;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  box-shadow:0 0 0 2px rgba(255,255,255,0.3);
}

.dados-grid input{
  margin-top:0;
}

/* DESCONTO */

.desconto-box{
  margin-top:40px;
  background:rgba(20,20,20,0.95);
  border:1px solid rgba(255,255,255,0.20);
  border-radius:20px;
  padding:25px;
}

.desconto-box h2{
  color:#ffffff;
  margin-bottom:20px;
}

select{
  width:200px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2b2b2b;
  color:white;
  font-size:16px;
  outline:none;
}

/* RESULTADO */

.resultado{
  margin-top:40px;
  background:rgba(10,10,10,0.95);
  border:2px solid rgba(255,255,255,0.25);
  border-radius:20px;
  padding:30px;
  box-shadow:0 0 25px rgba(255,255,255,0.10);
}

.resultado h2{
  color:#ffffff;
  margin-bottom:25px;
  font-size:32px;
}

.resultado-item{
  margin-bottom:15px;
  font-size:22px;
  color:#ccc;
}

.resultado-item span{
  color:white;
  font-weight:bold;
}

/* BOTÃO FINALIZAR */

.finalizar-btn{
  width:100%;
  margin-top:25px;
  padding:20px;

  border:1px solid rgba(255,255,255,0.4);
  border-radius:14px;

  background:#ffffff;
  color:#000000;

  font-size:20px;
  font-weight:bold;

  cursor:pointer;

  transition:0.3s;
}

.finalizar-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px rgba(255,255,255,0.4);
}

.finalizar-btn:active{
  transform:scale(0.98);
}

.finalizar-btn:disabled{
  opacity:0.5;
  cursor:not-allowed;
  transform:none;
}

/* RODAPÉ */

.rodape{
  margin-top:50px;
  text-align:center;
  color:#666;
  letter-spacing:2px;
}

/* RESPONSIVO */

@media(max-width:600px){

  body{
    padding:20px;
  }

  .titulo{
    font-size:30px;
  }

  .logo{
    width:140px;
  }

  .resultado h2{
    font-size:26px;
  }

  .resultado-item{
    font-size:18px;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- TOPO -->

  <div class="topo">

    <img src="logo.png" class="logo">

    <div class="titulo">
      Best Buds
    </div>

    <div class="sub">
      SISTEMA DE VENDAS
    </div>

  </div>


  <!-- DADOS DA VENDA -->

  <div class="dados-box">

    <h2>
      Dados da Venda
    </h2>

    <div class="dados-grid">

      <div>
        <label class="campo-label" for="nomeFuncionario">
          Nome Funcionário
        </label>

        <input
          type="text"
          id="nomeFuncionario"
          placeholder="Digite o nome do funcionário"
          oninput="calcular()"
        >
      </div>

      <div>
        <label class="campo-label" for="nomeCliente">
          Nome Cliente
        </label>

        <input
          type="text"
          id="nomeCliente"
          placeholder="Digite o nome do cliente"
          oninput="calcular()"
        >
      </div>

    </div>

  </div>


  <!-- ABAS -->

  <div class="abas">

    <button
      class="aba-btn ativa"
      onclick="trocarAba('ervas', this)"
    >
      Ervas
    </button>

  </div>


  <!-- ERVAS -->

  <div id="ervas" class="aba-conteudo">

    <div class="cards">


      <!-- SKUNK -->

      <div class="card">

        <img src="skunk.png">

        <div class="conteudo">

          <div class="nome">
            Skunk
          </div>

          <div class="info">
            Venda:
            <span>$120</span>
          </div>

          <input
            type="number"
            id="qtdSkunk"
            placeholder="Quantidade"
            min="0"
            oninput="calcular()"
          >

        </div>

      </div>


      <!-- PURPLE HAZE -->

      <div class="card">

        <img src="purple.png">

        <div class="conteudo">

          <div class="nome">
            Purple Haze
          </div>

          <div class="info">
            Venda:
            <span>$150</span>
          </div>

          <input
            type="number"
            id="qtdPurple"
            placeholder="Quantidade"
            min="0"
            oninput="calcular()"
          >

        </div>

      </div>


      <!-- BLUE DREAM -->

      <div class="card">

        <img src="blue.png">

        <div class="conteudo">

          <div class="nome">
            Blue Dream
          </div>

          <div class="info">
            Venda:
            <span>$200</span>
          </div>

          <input
            type="number"
            id="qtdBlue"
            placeholder="Quantidade"
            min="0"
            oninput="calcular()"
          >

        </div>

      </div>


      <!-- CBD -->

      <div class="card">

        <img src="cbd.png">

        <div class="conteudo">

          <div class="nome">
            CBD
          </div>

          <div class="info">
            Venda:
            <span>$100</span>
          </div>

          <input
            type="number"
            id="qtdCBD"
            placeholder="Quantidade"
            min="0"
            oninput="calcular()"
          >

        </div>

      </div>


    </div>

  </div>


  <!-- DESCONTO -->

  <div class="desconto-box">

    <h2>
      Desconto da Venda
    </h2>

    <select
      id="desconto"
      onchange="calcular()"
    >

      <option value="0">
        Sem desconto
      </option>

      <option value="5">
        5%
      </option>

      <option value="10">
        10%
      </option>

      <option value="15">
        15%
      </option>

      <option value="20">
        20%
      </option>

    </select>

  </div>


  <!-- RESULTADO -->

  <div class="resultado">

    <h2>
      Resultado da Operação
    </h2>

    <div class="resultado-item">

      Nome Funcionário:

      <span id="resFuncionario">
        —
      </span>

    </div>


    <div class="resultado-item">

      Nome Cliente:

      <span id="resCliente">
        —
      </span>

    </div>


    <div class="resultado-item">

      Valor Bruto:

      <span id="valorBruto">
        $0
      </span>

    </div>


    <div class="resultado-item">

      Desconto:

      <span id="valorDesconto">
        $0
      </span>

    </div>


    <div class="resultado-item">

      Valor Final:

      <span id="valorFinal">
        $0
      </span>

    </div>


    <div class="resultado-item">

      Valor Caixa:

      <span id="valorCaixa">
        $0
      </span>

    </div>


    <div class="resultado-item">

      Valor Funcionário:

      <span id="valorFuncionario">
        $0
      </span>

    </div>


  </div>


  <!-- FINALIZAR VENDA -->

  <button
    class="finalizar-btn"
    onclick="finalizarVenda()"
  >

    🛒 FINALIZAR VENDA

  </button>


  <!-- RODAPÉ -->

  <div class="rodape">

    by: addy

  </div>


</div>


<script>

/* ============================
   TROCAR ABA
============================ */

function trocarAba(aba, botao){

  document
    .querySelectorAll('.aba-conteudo')
    .forEach(el => {

      el.style.display = 'none';

    });

  document
    .getElementById(aba)
    .style.display = 'block';


  document
    .querySelectorAll('.aba-btn')
    .forEach(btn => {

      btn.classList.remove('ativa');

    });


  botao.classList.add('ativa');

}


/* ============================
   CALCULAR VENDA
============================ */

function calcular(){

  const nomeFuncionario =
    document.getElementById('nomeFuncionario').value.trim();


  const nomeCliente =
    document.getElementById('nomeCliente').value.trim();


  const qtdSkunk =
    parseInt(
      document.getElementById('qtdSkunk').value
    ) || 0;


  const qtdPurple =
    parseInt(
      document.getElementById('qtdPurple').value
    ) || 0;


  const qtdBlue =
    parseInt(
      document.getElementById('qtdBlue').value
    ) || 0;


  const qtdCBD =
    parseInt(
      document.getElementById('qtdCBD').value
    ) || 0;


  const desconto =
    parseInt(
      document.getElementById('desconto').value
    ) || 0;


  const valorBruto =

    (qtdSkunk * 120) +

    (qtdPurple * 150) +

    (qtdBlue * 100) +

    (qtdCBD * 100);


  const valorDesconto =
    valorBruto * (desconto / 100);


  const valorFinal =
    valorBruto - valorDesconto;


  const valorCaixa =
    valorFinal / 2;


  const valorFuncionario =
    valorFinal / 2;


  document.getElementById('resFuncionario').innerText =
    nomeFuncionario || '—';


  document.getElementById('resCliente').innerText =
    nomeCliente || '—';


  document.getElementById('valorBruto').innerText =
    '$' + valorBruto.toLocaleString('pt-BR');


  document.getElementById('valorDesconto').innerText =
    '$' + valorDesconto.toLocaleString('pt-BR');


  document.getElementById('valorFinal').innerText =
    '$' + valorFinal.toLocaleString('pt-BR');


  document.getElementById('valorCaixa').innerText =
    '$' + valorCaixa.toLocaleString('pt-BR');


  document.getElementById('valorFuncionario').innerText =
    '$' + valorFuncionario.toLocaleString('pt-BR');

}


/* ============================
   FINALIZAR VENDA
============================ */

async function finalizarVenda(){

  const nomeFuncionario =
    document.getElementById('nomeFuncionario').value.trim();


  const nomeCliente =
    document.getElementById('nomeCliente').value.trim();


  const qtdSkunk =
    parseInt(
      document.getElementById('qtdSkunk').value
    ) || 0;


  const qtdPurple =
    parseInt(
      document.getElementById('qtdPurple').value
    ) || 0;


  const qtdBlue =
    parseInt(
      document.getElementById('qtdBlue').value
    ) || 0;


  const qtdCBD =
    parseInt(
      document.getElementById('qtdCBD').value
    ) || 0;


  const desconto =
    parseInt(
      document.getElementById('desconto').value
    ) || 0;


  /* VALIDAÇÃO DE NOMES */

  if(!nomeFuncionario || !nomeCliente){

    alert(
      '⚠️ Preencha o Nome do Funcionário e o Nome do Cliente antes de finalizar a venda.'
    );

    return;

  }


  /* PRODUTOS */

  const produtos = [];


  if(qtdSkunk > 0){

    produtos.push({

      nome: 'Skunk',

      quantidade: qtdSkunk,

      preco: 120,

      subtotal: qtdSkunk * 120

    });

  }


  if(qtdPurple > 0){

    produtos.push({

      nome: 'Purple Haze',

      quantidade: qtdPurple,

      preco: 150,

      subtotal: qtdPurple * 150

    });

  }


  if(qtdBlue > 0){

    produtos.push({

      nome: 'Blue Dream',

      quantidade: qtdBlue,

      preco: 200,

      subtotal: qtdBlue * 200

    });

  }


  if(qtdCBD > 0){

    produtos.push({

      nome: 'CBD',

      quantidade: qtdCBD,

      preco: 100,

      subtotal: qtdCBD * 100

    });

  }


  /* VERIFICAR PRODUTOS */

  if(produtos.length === 0){

    alert(
      '⚠️ Adicione pelo menos um produto antes de finalizar a venda.'
    );

    return;

  }


  /* VALORES */

  const valorBruto =

    (qtdSkunk * 120) +

    (qtdPurple * 150) +

    (qtdBlue * 100) +

    (qtdCBD * 100);


  const valorDesconto =
    valorBruto * (desconto / 100);


  const valorFinal =
    valorBruto - valorDesconto;


  const valorCaixa =
    valorFinal / 2;


  const valorFuncionario =
    valorFinal / 2;


  /* BOTÃO */

  const botao =
    document.querySelector('.finalizar-btn');


  botao.disabled = true;

  botao.innerText =
    '⏳ ENVIANDO VENDA...';


  try{

    const resposta =
      await fetch('/api/venda', {

        method: 'POST',

        headers: {

          'Content-Type':
            'application/json'

        },

        body: JSON.stringify({

          nomeFuncionario: nomeFuncionario,

          nomeCliente: nomeCliente,

          produtos: produtos,

          valorBruto: valorBruto,

          desconto: desconto,

          valorDesconto: valorDesconto,

          valorFinal: valorFinal,

          valorCaixa: valorCaixa,

          valorFuncionario: valorFuncionario

        })

      });


    const resultado =
      await resposta.json();


    if(!resposta.ok){

      throw new Error(
        resultado.erro ||
        'Erro ao enviar a venda.'
      );

    }


    /* SUCESSO */

    alert(
      '✅ Venda registrada com sucesso!'
    );


    botao.innerText =
      '✅ VENDA FINALIZADA';


    /*
      Limpa os campos depois da venda
    */

    document.getElementById('nomeFuncionario').value = '';

    document.getElementById('nomeCliente').value = '';

    document.getElementById('qtdSkunk').value = '';

    document.getElementById('qtdPurple').value = '';

    document.getElementById('qtdBlue').value = '';

    document.getElementById('qtdCBD').value = '';

    document.getElementById('desconto').value = '0';


    calcular();


    setTimeout(() => {

      botao.disabled = false;

      botao.innerText =
        '🛒 FINALIZAR VENDA';

    }, 2000);


  }catch(erro){

    console.error(erro);


    alert(
      '❌ Não foi possível registrar a venda.\n\n' +
      erro.message
    );


    botao.disabled = false;

    botao.innerText =
      '🛒 FINALIZAR VENDA';

  }

}


/* CALCULAR AO ABRIR */

calcular();

</script>

</body>

</html>
